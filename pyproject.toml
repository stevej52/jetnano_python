[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jetnano-control"
version = "1.0.0"
description = "Joystick control for the Jetson Nano robot over Wi-Fi with automatic HC-12 radio failover"
readme = "README.md"
requires-python = ">=3.8"
dependencies = ["pyserial>=3.4"]

[project.optional-dependencies]
pi = ["pygame>=2.0"]
robot = ["adafruit-circuitpython-servokit>=1.3", "adafruit-circuitpython-bno055"]
modbus = ["pyModbusTCP>=0.2"]
realsense = ["pyrealsense2"]
test = ["pytest>=7", "pyModbusTCP>=0.2"]

[project.scripts]
jetnano-rx = "jetnano_control.receiver:main"
jetnano-tx = "jetnano_control.transmitter:main"
jetnano-joy = "jetnano_control.joytool:main"

[tool.setuptools.packages.find]
include = ["jetnano_control*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
